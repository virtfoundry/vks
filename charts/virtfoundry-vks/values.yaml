image:
  repository: ghcr.io/virtfoundry/vks
  tag: "" # set by Argo digest / CI
  digest: "" # sha256:… preferred
  pullPolicy: IfNotPresent

replicaCount: 1

# Default advertise address for Kamaji NodePort TCPs.
nodeAddress: ""
nodePort: 30443
# Default MetalLB pool for LoadBalancer TCPs when spec.controlPlane.addressPool
# is empty (homelab overlay: homelab-mgmt). Empty = cluster autoAssign.
loadBalancerAddressPool: ""

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceAccount:
  create: true
  name: vks-controller-manager
