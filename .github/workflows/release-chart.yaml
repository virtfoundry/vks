name: Release chart

# Publishes charts/virtfoundry-vks as an OCI artifact so the platform umbrella
# chart (helm-charts) can depend on it by version.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CHART_REPO: oci://ghcr.io/virtfoundry/charts

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Check chart version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          chart="$(awk '/^version:/ {print $2}' charts/virtfoundry-vks/Chart.yaml)"
          if [ "${GITHUB_REF_NAME#v}" != "$chart" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Chart.yaml version ${chart}"
            exit 1
          fi

      - name: Lint
        run: helm lint charts/virtfoundry-vks

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push
        run: |
          set -euo pipefail
          helm package charts/virtfoundry-vks --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP"/virtfoundry-vks-*.tgz "$CHART_REPO"
