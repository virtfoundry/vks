name: Build and push

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/virtfoundry/vks
  ARGO_HOMELAB_REPO: Matheus-Thurler/argo-homelab
  ARGO_VALUES_PATH: platform/vks/values-homelab.yaml

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pin digest in argo-homelab so Argo CD sees a Git change and rolls pods.
      # Requires repo secret ARGO_HOMELAB_TOKEN (contents:write on Matheus-Thurler/argo-homelab).
      - name: Pin image digest in argo-homelab
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          ARGO_HOMELAB_TOKEN: ${{ secrets.ARGO_HOMELAB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${ARGO_HOMELAB_TOKEN:-}" ]; then
            echo "::warning::Missing secret ARGO_HOMELAB_TOKEN on virtfoundry/vks (contents:write on ${ARGO_HOMELAB_REPO}). Skipping digest pin — add the secret to enable write-back."
            exit 0
          fi
          if [ -z "${IMAGE_DIGEST:-}" ]; then
            echo "::error::Missing image digest from build-push"
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA:0:7}"
          WORKDIR="${RUNNER_TEMP}/argo-homelab"
          BASIC_AUTH="$(printf 'x-access-token:%s' "${ARGO_HOMELAB_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraHeader="Authorization: Basic ${BASIC_AUTH}" \
            clone --depth 1 "https://github.com/${ARGO_HOMELAB_REPO}.git" "$WORKDIR" \
            || {
              echo "::error::Clone of ${ARGO_HOMELAB_REPO} failed. Rotate ARGO_HOMELAB_TOKEN (contents:write on that repo)."
              exit 1
            }
          cd "$WORKDIR"
          git config user.name "virtfoundry-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local http.https://github.com/.extraheader "Authorization: Basic ${BASIC_AUTH}"

          export IMAGE_NAME="${IMAGE}"
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path(os.environ["ARGO_VALUES_PATH"])
          text = path.read_text()
          digest = os.environ["IMAGE_DIGEST"]
          if not digest.startswith("sha256:"):
              raise SystemExit(f"unexpected digest: {digest}")
          out = re.sub(
              r'(?m)^(\s*digest:\s*)["\']?sha256:[0-9a-f]+["\']?',
              rf'\1"{digest}"',
              text,
              count=1,
          )
          if out == text:
              # Allow first-time pin when digest key exists with empty value.
              out = re.sub(
                  r'(?m)^(\s*digest:\s*)["\']?["\']?\s*$',
                  rf'\1"{digest}"',
                  text,
                  count=1,
              )
          if out == text:
              raise SystemExit("values file unchanged — check image.digest key exists")
          path.write_text(out)
          print(f"pinned {os.environ['IMAGE_NAME']}@{digest}")
          PY

          git add "$ARGO_VALUES_PATH"
          if git diff --cached --quiet; then
            echo "No digest change; skipping commit"
            exit 0
          fi
          git commit -m "chore(vks): pin image to ${SHORT_SHA}"
          git push origin HEAD:main
