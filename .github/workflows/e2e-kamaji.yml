name: E2E Kamaji

# Real E2E: Kind + cert-manager + Kamaji + the vks controller built from this checkout.
# Scope: TenantControlPlane Ready, kubeconfig Secret, worker Instance. See hack/e2e-kamaji.sh.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "hack/e2e-kamaji.sh"
      - ".github/workflows/e2e-kamaji.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: e2e-kamaji-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Kind + Kamaji
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Clone vks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clone helm-charts (pinned, Instance CRD)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: virtfoundry/helm-charts
          ref: 3d207e909176ca3e75fe91a2a29cc039ac9bef25
          path: helm-charts
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Create Kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: e2e

      - name: Build and load the vks image
        run: |
          docker build -t virtfoundry-vks:e2e .
          kind load docker-image virtfoundry-vks:e2e --name e2e

      - name: Run E2E
        env:
          HELM_CHARTS_DIR: ${{ github.workspace }}/helm-charts
        run: ./hack/e2e-kamaji.sh
