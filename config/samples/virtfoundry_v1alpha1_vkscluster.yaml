apiVersion: virtfoundry.io/v1alpha1
kind: VKSCluster
metadata:
  name: demo
  namespace: virtfoundry-tenant-default
spec:
  kubernetesVersion: v1.36.5
  # controlPlane defaults: serviceType=LoadBalancer, port=443
  # VIP from cluster LB (MetalLB autoAssign when unset — no pool pin).
  # Pin a pool per cluster (overrides controller --load-balancer-address-pool):
  # controlPlane:
  #   addressPool: homelab-public
  # For lab NodePort instead:
  # controlPlane:
  #   serviceType: NodePort
  #   address: 10.0.30.250
  #   port: 30443
  workers:
    count: 1
    templateRef:
      name: ubuntu-node-1-36-5
    offeringRef:
      name: medium
    networkRef:
      name: default-default   # Network CR name: <vpc>-<network>
    # sshKeyRefs:
    #   - name: my-ssh-key
